<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PDF original</title>
  <!-- Estilos exclusivos da prévia; o restante da aplicação usa style/style.css. -->
  <style>
    body{margin:0;padding:14px;background:#e8edf3;color:#455d74;font:12px 'Segoe UI',sans-serif}
    p{text-align:center;line-height:1.6}
    canvas{display:block;width:100%;height:auto;background:white;box-shadow:0 2px 8px #173b521c;margin:0 auto 14px}
    #paginas{max-width:1000px;margin:auto}
    .pdf-page{position:relative;margin:0 auto 14px}
    .pdf-page canvas{margin:0}
    .pdf-highlight{position:absolute;box-sizing:border-box;border:3px solid #e28720;background:#ffd26955;box-shadow:0 0 0 3px #fff8;pointer-events:none;border-radius:3px}
  </style>
</head>
<body>
  <!-- visualizar.js cria um canvas para cada página do PDF. -->
  <p id="estado" role="status">Carregando PDF original…</p>
  <div id="paginas"></div>
  <script type="module" src="/visualizar.js"></script>
</body>
</html>
